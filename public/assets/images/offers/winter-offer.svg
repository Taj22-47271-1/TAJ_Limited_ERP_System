<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="winterBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06231a"/>
      <stop offset="45%" stop-color="#0c3c2e"/>
      <stop offset="100%" stop-color="#031610"/>
    </linearGradient>
    <linearGradient id="goldWinter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e1"/>
      <stop offset="40%" stop-color="#ffd54f"/>
      <stop offset="100%" stop-color="#ffb300"/>
    </linearGradient>
    <filter id="winterGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#winterBg)"/>

  <!-- Subtle Snowflakes Pattern in Background -->
  <g stroke="#ffffff" stroke-width="1.2" opacity="0.15" stroke-linecap="round">
    <!-- Snowflake 1 -->
    <g transform="translate(140, 120)">
      <line x1="0" y1="-28" x2="0" y2="28"/>
      <line x1="-28" y1="0" x2="28" y2="0"/>
      <line x1="-20" y1="-20" x2="20" y2="20"/>
      <line x1="20" y1="-20" x2="-20" y2="20"/>
      <circle cx="0" cy="0" r="4" fill="#fff"/>
    </g>
    <!-- Snowflake 2 -->
    <g transform="translate(680, 160)">
      <line x1="0" y1="-35" x2="0" y2="35"/>
      <line x1="-35" y1="0" x2="35" y2="0"/>
      <line x1="-25" y1="-25" x2="25" y2="25"/>
      <line x1="25" y1="-25" x2="-25" y2="25"/>
      <circle cx="0" cy="0" r="5" fill="#fff"/>
    </g>
    <!-- Snowflake 3 -->
    <g transform="translate(220, 390)">
      <line x1="0" y1="-20" x2="0" y2="20"/>
      <line x1="-20" y1="0" x2="20" y2="0"/>
      <circle cx="0" cy="0" r="3" fill="#fff"/>
    </g>
    <!-- Snowflake 4 -->
    <g transform="translate(620, 420)">
      <line x1="0" y1="-22" x2="0" y2="22"/>
      <line x1="-22" y1="0" x2="22" y2="0"/>
      <circle cx="0" cy="0" r="3" fill="#fff"/>
    </g>
  </g>

  <!-- Glowing Golden Festive Ornaments / Bells -->
  <g transform="translate(400, 220)" filter="url(#winterGlow)">
    <!-- Big Golden Ribbon Bow -->
    <path d="M 0,0 C -50,-60 -90,0 -40,30 C -10,45 0,0 0,0 Z" fill="url(#goldWinter)"/>
    <path d="M 0,0 C 50,-60 90,0 40,30 C 10,45 0,0 0,0 Z" fill="url(#goldWinter)"/>
    <circle cx="0" cy="10" r="14" fill="#ffd54f"/>
    <!-- Left Ribbon Tail -->
    <path d="M -12,20 Q -40,70 -70,95 Q -40,85 -10,65 Z" fill="url(#goldWinter)"/>
    <!-- Right Ribbon Tail -->
    <path d="M 12,20 Q 40,70 70,95 Q 40,85 10,65 Z" fill="url(#goldWinter)"/>
  </g>

  <!-- Golden Holiday Baubles / Spheres -->
  <g transform="translate(320, 310)" filter="url(#winterGlow)">
    <circle cx="0" cy="0" r="48" fill="url(#goldWinter)"/>
    <ellipse cx="-14" cy="-14" rx="14" ry="9" fill="#ffffff" opacity="0.6"/>
  </g>
  <g transform="translate(480, 320)" filter="url(#winterGlow)">
    <circle cx="0" cy="0" r="42" fill="#c62828" stroke="url(#goldWinter)" stroke-width="3"/>
    <ellipse cx="-12" cy="-12" rx="12" ry="7" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Christmas Pine Tree Garland Silhouette -->
  <path d="M 0,500 Q 200,430 400,490 T 800,470 L 800,600 L 0,600 Z" fill="#031a13"/>
  <line x1="0" y1="520" x2="800" y2="520" stroke="url(#goldWinter)" stroke-width="3"/>

  <!-- Badge Container -->
  <g transform="translate(400, 480)">
    <rect x="-190" y="-30" width="380" height="60" rx="30" fill="rgba(3, 26, 19, 0.95)" stroke="url(#goldWinter)" stroke-width="2" filter="url(#winterGlow)"/>
    <text x="0" y="7" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#fff9c4" text-anchor="middle" letter-spacing="4">
      BORO DIN &amp; NEW YEAR OFFER
    </text>
  </g>
</svg>

