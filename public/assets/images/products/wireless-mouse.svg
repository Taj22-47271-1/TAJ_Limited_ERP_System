<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wmBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wmWheel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="wmShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Ground Shadow -->
  <ellipse cx="200" cy="335" rx="100" ry="16" fill="#0f172a" opacity="0.16"/>
  <g filter="url(#wmShadow)">
    <!-- Mouse Ergonomic Body -->
    <path d="M130 170 C130 90, 165 50, 200 50 C235 50, 270 90, 270 170 C270 270, 250 315, 200 315 C150 315, 130 270, 130 170 Z" fill="url(#wmBody)" stroke="#475569" stroke-width="1.5"/>
    <!-- Left Thumb Rest Curve -->
    <path d="M132 170 C132 240, 142 285, 175 305 C152 285, 142 240, 142 170 C142 125, 150 90, 165 72 C142 90, 132 125, 132 170 Z" fill="#475569" opacity="0.45"/>
    <!-- Center Clicker Split Seam -->
    <path d="M200 50 L200 155" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Scroll Wheel Housing & Wheel -->
    <rect x="190" y="85" width="20" height="42" rx="10" fill="#0f172a"/>
    <rect x="193" y="90" width="14" height="32" rx="7" fill="url(#wmWheel)"/>
    <line x1="193" y1="100" x2="207" y2="100" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="193" y1="110" x2="207" y2="110" stroke="#0369a1" stroke-width="1.5"/>
    <!-- DPI Button -->
    <rect x="195" y="140" width="10" height="8" rx="2" fill="#64748b"/>
    <!-- Subtle LED Logo Accent -->
    <circle cx="200" cy="245" r="10" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8"/>
    <path d="M200 239 L200 251 M194 245 L206 245" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
  </g>
</svg>
