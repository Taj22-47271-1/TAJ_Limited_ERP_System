<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="wheelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bg)"/>
  <ellipse cx="200" cy="310" rx="90" ry="14" fill="#0f172a" opacity="0.12"/>
  <g filter="url(#shadow)">
    <!-- Mouse body -->
    <path d="M140 160 C140 90, 170 60, 200 60 C230 60, 260 90, 260 160 C260 250, 245 290, 200 290 C155 290, 140 250, 140 160 Z" fill="url(#bodyGrad)"/>
    <!-- Mouse ergonomic side accent -->
    <path d="M142 160 C142 220, 150 260, 180 280 C160 260, 150 220, 150 160 C150 120, 158 90, 170 75 C150 90, 142 120, 142 160 Z" fill="#475569" opacity="0.4"/>
    <!-- Center seam -->
    <path d="M200 60 L200 150" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Scroll Wheel -->
    <rect x="193" y="90" width="14" height="34" rx="7" fill="url(#wheelGrad)"/>
    <line x1="193" y1="102" x2="207" y2="102" stroke="#0369a1" stroke-width="1.5"/>
    <line x1="193" y1="112" x2="207" y2="112" stroke="#0369a1" stroke-width="1.5"/>
    <!-- Subtle LED logo / mark -->
    <circle cx="200" cy="225" r="9" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.7"/>
    <path d="M200 220 L200 230 M195 225 L205 225" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>
  <text x="200" y="355" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.08em">WIRELESS OPTICAL MOUSE</text>
</svg>
