<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="dfBox" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="dfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
  </defs>
  <!-- Ground Shadow -->
  <ellipse cx="200" cy="325" rx="110" ry="16" fill="#0f172a" opacity="0.15"/>
  <g filter="url(#dfShadow)">
    <!-- Package Box Outline -->
    <rect x="110" y="100" width="180" height="190" rx="18" fill="url(#dfBox)" stroke="#94a3b8" stroke-width="2"/>
    <!-- Box Flap Line -->
    <path d="M110 160 L200 200 L290 160" stroke="#94a3b8" stroke-width="2" fill="none"/>
    <line x1="200" y1="200" x2="200" y2="290" stroke="#94a3b8" stroke-width="2"/>
    <!-- Tape -->
    <rect x="188" y="100" width="24" height="60" fill="#f59e0b" opacity="0.85"/>
    <!-- Center Product Sparkle Mark -->
    <circle cx="200" cy="145" r="16" fill="#0284c7" opacity="0.9"/>
    <path d="M200 135 L200 155 M190 145 L210 145" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
