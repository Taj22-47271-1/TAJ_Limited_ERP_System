<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cfGoldCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="cfCoffeeDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="70%" stop-color="#270d03"/>
      <stop offset="100%" stop-color="#140601"/>
    </linearGradient>
    <filter id="cfShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#451a03" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Ground Shadow -->
  <ellipse cx="200" cy="340" rx="90" ry="16" fill="#0f172a" opacity="0.18"/>
  <g filter="url(#cfShadow)">
    <!-- Jar Glass Body -->
    <rect x="135" y="90" width="130" height="235" rx="20" fill="url(#cfCoffeeDark)" stroke="#78350f" stroke-width="2"/>
    <!-- Gold Ribbed Cap -->
    <rect x="142" y="48" width="116" height="44" rx="8" fill="url(#cfGoldCap)" stroke="#b45309" stroke-width="1.5"/>
    <line x1="144" y1="62" x2="256" y2="62" stroke="#fef3c7" stroke-width="1.5" opacity="0.6"/>
    <!-- Glass Highlights / Sheen -->
    <path d="M145 105 L145 310 Q152 300 152 115 Z" fill="#ffffff" opacity="0.14"/>
    <path d="M255 105 L255 310 Q248 300 248 115 Z" fill="#ffffff" opacity="0.08"/>
    <!-- Front Brand Label -->
    <rect x="145" y="145" width="110" height="125" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
    <!-- Coffee Bean Icon -->
    <ellipse cx="200" cy="180" rx="14" ry="10" fill="#78350f"/>
    <path d="M194 175 Q200 180 206 185" stroke="#fef3c7" stroke-width="2" fill="none"/>
    <!-- Label Typography -->
    <text x="200" y="210" font-family="'Inter', sans-serif" font-size="13" font-weight="900" fill="#451a03" text-anchor="middle" letter-spacing="0.06em">ROAST</text>
    <text x="200" y="228" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#92400e" text-anchor="middle" letter-spacing="0.1em">INSTANT COFFEE</text>
    <rect x="175" y="238" width="50" height="6" rx="3" fill="#d97706"/>
    <text x="200" y="258" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#78350f" text-anchor="middle">NET WT 200G</text>
  </g>
</svg>
