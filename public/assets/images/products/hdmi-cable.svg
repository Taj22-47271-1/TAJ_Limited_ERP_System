<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgHdmi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="goldConnector" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadowHdmi" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bgHdmi)"/>
  <ellipse cx="200" cy="305" rx="80" ry="12" fill="#0f172a" opacity="0.12"/>
  <g filter="url(#shadowHdmi)">
    <!-- Coiled Cable Loops -->
    <ellipse cx="200" cy="210" rx="80" ry="60" fill="none" stroke="#1e293b" stroke-width="12"/>
    <ellipse cx="200" cy="200" rx="75" ry="55" fill="none" stroke="#334155" stroke-width="10"/>
    <!-- Cable Straps / Ties -->
    <rect x="188" y="145" width="24" height="120" rx="4" fill="#ef4444" opacity="0.85"/>
    <text x="200" y="210" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" transform="rotate(-90 200 210)">VELCRO</text>
    <!-- HDMI Plug Left -->
    <g transform="translate(110, 110)">
      <!-- Strain relief -->
      <rect x="0" y="20" width="16" height="40" rx="4" fill="#0f172a"/>
      <!-- Plug housing -->
      <rect x="12" y="10" width="30" height="60" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <text x="27" y="44" font-family="'Inter', sans-serif" font-size="7" font-weight="900" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 27 44)">HDMI 4K</text>
      <!-- Gold Connector Tip -->
      <polygon points="42,22 58,22 62,28 62,52 58,58 42,58" fill="url(#goldConnector)"/>
      <rect x="46" y="28" width="12" height="24" rx="2" fill="#78350f"/>
    </g>
  </g>
  <text x="200" y="350" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.08em">4K HIGH-SPEED HDMI CABLE (2M)</text>
</svg>
