<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="hdmiGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="hdmiPlug" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="hdmiShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Ground Shadow -->
  <ellipse cx="200" cy="330" rx="130" ry="16" fill="#0f172a" opacity="0.16"/>
  <g filter="url(#hdmiShadow)">
    <!-- Coiled Cable Loops -->
    <ellipse cx="205" cy="205" rx="115" ry="85" fill="none" stroke="#1e293b" stroke-width="15"/>
    <ellipse cx="198" cy="195" rx="105" ry="75" fill="none" stroke="#334155" stroke-width="14"/>
    <ellipse cx="202" cy="190" rx="90" ry="65" fill="none" stroke="#475569" stroke-width="12" opacity="0.8"/>
    <!-- Red Velcro Strap / Tie -->
    <rect x="188" y="105" width="26" height="180" rx="5" fill="#ef4444"/>
    <text x="201" y="195" font-family="'Inter', sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle" transform="rotate(-90 201 195)">VELCRO</text>
    <!-- HDMI Connector (Left / Foreground) -->
    <g transform="translate(65, 155)">
      <!-- Flexible relief -->
      <rect x="0" y="22" width="22" height="38" rx="4" fill="#0f172a"/>
      <line x1="6" y1="26" x2="6" y2="56" stroke="#334155" stroke-width="2"/>
      <line x1="12" y1="26" x2="12" y2="56" stroke="#334155" stroke-width="2"/>
      <!-- Plug Aluminum Housing -->
      <rect x="18" y="12" width="46" height="58" rx="7" fill="url(#hdmiPlug)" stroke="#64748b" stroke-width="1.5"/>
      <text x="41" y="45" font-family="'Inter', sans-serif" font-size="8" font-weight="900" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 41 45)">HDMI 4K</text>
      <!-- Gold Connector Tip -->
      <polygon points="64,22 86,22 92,29 92,53 86,60 64,60" fill="url(#hdmiGold)"/>
      <rect x="70" y="28" width="16" height="26" rx="2" fill="#78350f"/>
    </g>
    <!-- Secondary HDMI Tip (Right / Background) -->
    <g transform="translate(255, 110)">
      <rect x="0" y="14" width="38" height="46" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <polygon points="38,22 55,22 60,28 60,46 55,52 38,52" fill="url(#hdmiGold)"/>
    </g>
  </g>
</svg>
