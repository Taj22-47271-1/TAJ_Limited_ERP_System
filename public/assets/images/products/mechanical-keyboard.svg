<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="kbFrame" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="kbShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- Ground Shadow -->
  <ellipse cx="200" cy="305" rx="160" ry="18" fill="#0f172a" opacity="0.16"/>
  <g filter="url(#kbShadow)">
    <!-- Keyboard Chassis Base -->
    <rect x="35" y="105" width="330" height="175" rx="16" fill="url(#kbFrame)" stroke="#475569" stroke-width="2"/>
    <!-- RGB Glow Underplate -->
    <rect x="48" y="116" width="304" height="152" rx="10" fill="#1e293b"/>
    <!-- Row 1 Keys -->
    <g fill="#475569" stroke="#334155" stroke-width="1">
      <rect x="54" y="124" width="24" height="20" rx="3.5" fill="#f59e0b"/>
      <rect x="83" y="124" width="24" height="20" rx="3.5"/>
      <rect x="112" y="124" width="24" height="20" rx="3.5"/>
      <rect x="141" y="124" width="24" height="20" rx="3.5"/>
      <rect x="170" y="124" width="24" height="20" rx="3.5"/>
      <rect x="199" y="124" width="24" height="20" rx="3.5"/>
      <rect x="228" y="124" width="24" height="20" rx="3.5"/>
      <rect x="257" y="124" width="24" height="20" rx="3.5"/>
      <rect x="286" y="124" width="24" height="20" rx="3.5"/>
      <rect x="315" y="124" width="31" height="20" rx="3.5" fill="#ef4444"/>
    </g>
    <!-- Row 2 Keys -->
    <g fill="#334155" stroke="#1e293b" stroke-width="1">
      <rect x="54" y="149" width="31" height="20" rx="3.5"/>
      <rect x="89" y="149" width="22" height="20" rx="3.5"/>
      <rect x="115" y="149" width="22" height="20" rx="3.5"/>
      <rect x="141" y="149" width="22" height="20" rx="3.5"/>
      <rect x="167" y="149" width="22" height="20" rx="3.5"/>
      <rect x="193" y="149" width="22" height="20" rx="3.5"/>
      <rect x="219" y="149" width="22" height="20" rx="3.5"/>
      <rect x="245" y="149" width="22" height="20" rx="3.5"/>
      <rect x="271" y="149" width="22" height="20" rx="3.5"/>
      <rect x="297" y="149" width="49" height="20" rx="3.5"/>
    </g>
    <!-- Row 3 Keys -->
    <g fill="#334155" stroke="#1e293b" stroke-width="1">
      <rect x="54" y="174" width="38" height="20" rx="3.5"/>
      <rect x="96" y="174" width="22" height="20" rx="3.5"/>
      <rect x="122" y="174" width="22" height="20" rx="3.5"/>
      <rect x="148" y="174" width="22" height="20" rx="3.5" fill="#10b981"/>
      <rect x="174" y="174" width="22" height="20" rx="3.5"/>
      <rect x="200" y="174" width="22" height="20" rx="3.5"/>
      <rect x="226" y="174" width="22" height="20" rx="3.5"/>
      <rect x="252" y="174" width="22" height="20" rx="3.5"/>
      <rect x="278" y="174" width="22" height="20" rx="3.5"/>
      <rect x="304" y="174" width="42" height="20" rx="3.5" fill="#3b82f6"/>
    </g>
    <!-- Row 4 Keys (Spacebar row) -->
    <g fill="#475569" stroke="#1e293b" stroke-width="1">
      <rect x="54" y="199" width="32" height="20" rx="3.5"/>
      <rect x="90" y="199" width="24" height="20" rx="3.5"/>
      <rect x="118" y="199" width="148" height="20" rx="4" fill="#64748b"/>
      <rect x="270" y="199" width="24" height="20" rx="3.5"/>
      <rect x="298" y="199" width="24" height="20" rx="3.5"/>
      <rect x="326" y="199" width="20" height="20" rx="3.5"/>
    </g>
    <!-- Status LEDs top right -->
    <circle cx="320" cy="116" r="2.5" fill="#10b981"/>
    <circle cx="330" cy="116" r="2.5" fill="#38bdf8"/>
    <circle cx="340" cy="116" r="2.5" fill="#ef4444"/>
  </g>
</svg>
