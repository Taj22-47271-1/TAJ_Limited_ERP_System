<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="wtBottle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bae6fd"/>
      <stop offset="30%" stop-color="#f0f9ff"/>
      <stop offset="70%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#7dd3fc"/>
    </linearGradient>
    <linearGradient id="wtCap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="wtLabel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="wtShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Ground Shadow -->
  <ellipse cx="200" cy="350" rx="75" ry="16" fill="#0f172a" opacity="0.16"/>
  <g filter="url(#wtShadow)">
    <!-- Blue Screw Cap -->
    <rect x="182" y="42" width="36" height="26" rx="5" fill="url(#wtCap)"/>
    <line x1="184" y1="50" x2="216" y2="50" stroke="#bae6fd" stroke-width="1.5"/>
    <line x1="184" y1="58" x2="216" y2="58" stroke="#bae6fd" stroke-width="1.5"/>
    <!-- Ring seal -->
    <rect x="180" y="68" width="40" height="6" rx="2" fill="#0369a1"/>
    <!-- Bottle Neck -->
    <rect x="187" y="74" width="26" height="18" fill="url(#wtBottle)" stroke="#7dd3fc" stroke-width="1"/>
    <!-- Bottle Tapered Shoulder -->
    <path d="M187 92 L155 145 L245 145 L213 92 Z" fill="url(#wtBottle)" stroke="#7dd3fc" stroke-width="1.5"/>
    <!-- Main Cylinder Body -->
    <rect x="155" y="145" width="90" height="190" rx="14" fill="url(#wtBottle)" stroke="#7dd3fc" stroke-width="1.5"/>
    <!-- Grip Contour Grooves -->
    <line x1="158" y1="165" x2="242" y2="165" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="158" y1="265" x2="242" y2="265" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="158" y1="285" x2="242" y2="285" stroke="#7dd3fc" stroke-width="2"/>
    <line x1="158" y1="305" x2="242" y2="305" stroke="#7dd3fc" stroke-width="2"/>
    <!-- Cyan Freshness Label -->
    <rect x="155" y="185" width="90" height="68" fill="url(#wtLabel)"/>
    <!-- Droplet Icon -->
    <path d="M200 196 C195 204, 191 210, 191 215 A9 9 0 0 0 209 215 C209 210, 205 204, 200 196 Z" fill="#ffffff"/>
    <text x="200" y="235" font-family="'Inter', sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="0.08em">NATURAL</text>
    <text x="200" y="246" font-family="'Inter', sans-serif" font-size="8" font-weight="700" fill="#bae6fd" text-anchor="middle">500 ML</text>
    <!-- Light Reflection Highlight -->
    <path d="M162 148 L162 330 Q168 320 168 155 Z" fill="#ffffff" opacity="0.3"/>
  </g>
</svg>
