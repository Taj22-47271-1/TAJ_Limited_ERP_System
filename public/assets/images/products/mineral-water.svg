<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgWater" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="50%" stop-color="#f0f9ff"/>
      <stop offset="100%" stop-color="#bae6fd"/>
    </linearGradient>
    <linearGradient id="capGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="labelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadowWater" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0369a1" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="400" height="400" rx="24" fill="url(#bgWater)"/>
  <ellipse cx="200" cy="305" rx="50" ry="12" fill="#0f172a" opacity="0.12"/>
  <g filter="url(#shadowWater)">
    <!-- Cap -->
    <rect x="186" y="65" width="28" height="20" rx="4" fill="url(#capGrad)"/>
    <line x1="186" y1="72" x2="214" y2="72" stroke="#38bdf8" stroke-width="1.5"/>
    <!-- Neck -->
    <rect x="190" y="85" width="20" height="15" fill="url(#bottleGrad)" stroke="#7dd3fc" stroke-width="1"/>
    <!-- Bottle Upper Taper -->
    <path d="M190 100 L165 140 L235 140 L210 100 Z" fill="url(#bottleGrad)" stroke="#7dd3fc" stroke-width="1"/>
    <!-- Main Body -->
    <rect x="165" y="140" width="70" height="150" rx="10" fill="url(#bottleGrad)" stroke="#7dd3fc" stroke-width="1"/>
    <!-- Ridges on bottle -->
    <line x1="167" y1="155" x2="233" y2="155" stroke="#7dd3fc" stroke-width="1.5"/>
    <line x1="167" y1="245" x2="233" y2="245" stroke="#7dd3fc" stroke-width="1.5"/>
    <line x1="167" y1="265" x2="233" y2="265" stroke="#7dd3fc" stroke-width="1.5"/>
    <!-- Freshness Label -->
    <rect x="165" y="175" width="70" height="55" fill="url(#labelGrad)"/>
    <path d="M193 190 Q200 180 207 190 T200 205 Z" fill="#ffffff" opacity="0.9"/>
    <text x="200" y="220" font-family="'Inter', sans-serif" font-size="9" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.05em">PURE 500ML</text>
  </g>
  <text x="200" y="350" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="0.08em">MINERAL WATER 500ML</text>
</svg>
